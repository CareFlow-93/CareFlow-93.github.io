    function apply(lang) {

        current = lang;
        var t = I18N[lang];
        document.documentElement.lang = lang;
        document.title = t.title + " | CareFlow";
        document.getElementById("legal-title").textContent = t.title;
        document.getElementById("legal-updated").textContent = t.updated;

        document.querySelectorAll(".site-footer [data-i18n]").forEach(function (el) {
            var key = el.getAttribute("data-i18n");
            if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll(".legal-lang button").forEach(function (btn) {
            btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
        });
        try { localStorage.setItem("careflow-lang", lang); } catch (e) {}
    }

    function initial() {
        try {
            var p = new URLSearchParams(location.search).get("lang");
            if (p && I18N[p]) return p;
        } catch (e) {}
        try {
            var s = localStorage.getItem("careflow-lang");
            if (s && I18N[s]) return s;
        } catch (e) {}
        var nav = (navigator.language || "").toLowerCase();
        if (nav.indexOf("ne") === 0) return "ne";
        if (nav.indexOf("ko") === 0) return "ko";
        return "en";
    }

    document.querySelectorAll(".legal-lang button").forEach(function (btn) {
        btn.addEventListener("click", function () { apply(btn.getAttribute("data-lang")); });
